<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neha Yadav — Software Engineer</title>
    <meta
      name="description"
      content="Neha Yadav is a software engineer in Mumbai who builds fintech interfaces people use without a manual — Angular, React and TypeScript."

      rel="stylesheet"
    />

    <!--
      The layout and palette are fixed on <html> above (zine + citrus).
      If SHOW_LAYOUT_PICKER or SHOW_PALETTE_PICKER is re-enabled in
      src/theme/themes.ts, restore the pre-paint restore script here so
      a remembered choice doesn't flash the default first:

      <script>
        (function () {
          try {
            var saved = localStorage.getItem('ny-edition')
            var allowed = ['editorial','zine','bento','dossier','broadsheet','poster','timeline']
            if (saved && allowed.indexOf(saved) !== -1) {
              document.documentElement.dataset.edition = saved
            }
          } catch (e) {}
        })()
      </script>
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
