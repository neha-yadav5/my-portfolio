<!doctype html>
<html lang="en" data-theme="citrus" data-edition="bento">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neha Yadav — Software Engineer</title>
    <meta
      name="description"
      content="Neha Yadav is a software engineer in Mumbai who builds fintech interfaces people use without a manual — Angular, React and TypeScript."
    />
    <meta name="keywords" content="Neha Yadav, Software Engineer, Angular, React, TypeScript, Fintech, Mumbai" />

    <meta property="og:title" content="Neha Yadav — Software Engineer" />
    <meta
      property="og:description"
      content="Four years of turning credit ops, KYC and underwriting workflows into interfaces people actually enjoy using."
    />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved design + palette before first paint so nothing flashes.
      (function () {
        try {
          var themes = ['citrus', 'blossom', 'sorbet', 'moss', 'blueprint', 'lagoon', 'grape']
          var editions = [
            'editorial',
            'zine',
            'bento',
            'dossier',
            'broadsheet',
            'poster',
            'timeline',
          ]

          var theme = localStorage.getItem('ny-theme')
          if (theme && themes.indexOf(theme) !== -1) {
            document.documentElement.dataset.theme = theme
          }

          var edition = localStorage.getItem('ny-edition')
          if (edition && editions.indexOf(edition) !== -1) {
            document.documentElement.dataset.edition = edition
          }
        } catch (e) {
          /* storage blocked — keep the defaults */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
